name: CI

on:
  push:
    branches:
      - dev
      - "feature/**"
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Storybook stories check
        run: npm run stories:check

      - name: Storybook build
        run: npm run storybook:build

      - name: Component tests
        run: npm run test:components

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore BackendFungi/BackendFungi.sln

      - name: Build
        run: dotnet build BackendFungi/BackendFungi.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test BackendFungi/BackendFungi.sln --configuration Release --no-build

  e2e-smoke:
    name: E2E Smoke
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Playwright browser
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: Start backend stack
        run: docker compose up -d --build fungi-db fungi-backend

      - name: Wait backend readiness
        run: |
          for i in {1..90}; do
            if curl -fsS http://localhost:5000/swagger/v1/swagger.json > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend is not ready in time"
          docker compose logs fungi-backend
          exit 1

      - name: Run Playwright smoke tests
        run: npm --prefix frontend run e2e:smoke

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

      - name: Stop backend stack
        if: always()
        run: docker compose down -v

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt

      - name: Build docs
        run: python -m mkdocs build --strict
