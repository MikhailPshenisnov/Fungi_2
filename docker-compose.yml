# чтобы поднять стэк: cmd/powershell находясь в этой папке > docker-compose up --build
services:
  fungi-db:
    image: postgres:17
    container_name: fungi-db
    environment:
      POSTGRES_DB: FungiDB
      POSTGRES_USER: fungi
      POSTGRES_PASSWORD: fungi
      PGPORT: 5531
    volumes:
      - pg_fungi_data:/var/lib/postgresql/data
      - ./DBInit:/docker-entrypoint-initdb.d  
    ports:
      - "5531:5531"

  fungi-backend:
    container_name: fungi-backend
    build:
      context: ./BackendFungi
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__FungiDb=${DB_CONNECTION_STRING}
    volumes:
      - fungi_backend_avatars:/app/Storage/avatars
      - fungi_backend_articles:/app/Storage/articles
    depends_on:
      - fungi-db

  fungi-frontend:
    container_name: fungi-frontend
    image: node:20-alpine
    working_dir: /app
    command: sh -c "if [ ! -d node_modules ] || [ -z \"$(ls -A node_modules 2>/dev/null)\" ]; then npm ci --no-audit --no-fund; fi && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend_fungi:/app
      - fungi_frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - fungi-backend

  fungi-docs:
    container_name: fungi-docs
    build:
      context: .
      dockerfile: docs/Dockerfile
    working_dir: /workspace
    command: mkdocs serve -a 0.0.0.0:8000
    volumes:
      - ./:/workspace
    ports:
      - "8000:8000"


volumes:
  pg_fungi_data:
  fungi_frontend_node_modules:
  fungi_backend_avatars:
  fungi_backend_articles:
